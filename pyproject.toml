[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "monaco-independent-mu"
version = "0.1.0"
description = "Independent Monte Carlo MU and 3D dose verification for Elekta Monaco plans"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "pydicom>=3.0",
  "pydantic>=2.9",
  "PyYAML>=6.0",
  "click>=8.1",
  "rich>=13.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  "mypy>=1.13",
]

gamma = [
  "pymedphys",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/indep_mu"]
